# Platform-agnostic electron-builder configuration. Loaded by
# electron-builder.yml via `extends:` and shared by every OS profile.
# Profile-specific sections live in electron-builder.{mac,win}.yml and are
# only consumed on the matching host platform.

appId: com.transportx.traffic-agent
productName: TransportX Agent
asar: true
asarUnpack:
  - modules/**
  - src/contracts/**
  # FileSet unpack matching uses its source path, before remapping to modules/.
  - dist/module-extensions/**
afterPack: desktop/scripts/after-pack.cjs
directories:
  output: release
  buildResources: desktop/assets
files:
  - package.json
  - dist-desktop/**
  - bin/**
  - dist/web/**
  - modules/**
  - "!modules/installable/**"
  - "!modules/shared/**"
  - "!modules/official/module-authoring/extensions/pi-module-package/index.ts"
  - "!modules/capabilities/citation/extensions/pi-citation/index.ts"
  - "!modules/capabilities/spatial-analysis/extensions/pi-spatial-analysis/index.ts"
  - from: dist/module-extensions
    to: modules
  - src/contracts/**
  - src/server/prompts/**
extraResources:
  - from: desktop/build/runtime-manifest.json
    to: runtime-manifest.json
  - from: desktop/build/runtimes/python
    to: runtimes/python
