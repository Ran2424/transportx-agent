<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="850" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc">
<title id="title">TransportX 整体架构</title>
<desc id="desc">交互入口连接本地 Agent Host；Host 装配版本化 Module 并启动 Pi Agent；Pi Agent 调用模型、工具、Python 分析和领域服务。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6f8297" stroke-width="1.6"/>
  </marker>
</defs>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.heading{font-size:28px;font-weight:680;fill:#172e44}.subtitle{font-size:14px;fill:#65778a}
.kicker{font-size:12px;font-weight:700;letter-spacing:1px}.name{font-size:23px;font-weight:680;fill:#172e44}
.body{font-size:15px;fill:#42576d}.small{font-size:12px;fill:#68798a}
.module-title{font-size:15px;font-weight:650;fill:#73521d}.module-body{font-size:13px;fill:#846840}
.label{font-size:13px;font-weight:650;fill:#52667a}
.edge{fill:none;stroke:#6f8297;stroke-width:1.7;marker-end:url(#arrow)}
.dash{fill:none;stroke:#6f8297;stroke-width:1.7;stroke-dasharray:5 5;marker-end:url(#arrow)}
</style>

<rect width="1160" height="850" rx="22" fill="#f8fafc"/>
<text x="36" y="48" class="heading">TransportX 整体架构</text>
<text x="36" y="76" class="subtitle">本地 Host 串联工作台界面、版本化模块、Agent 循环、模型服务与分析运行时。</text>

<path class="edge" d="M580 220 V280"/>
<text x="606" y="255" class="label">用户请求 / 状态反馈</text>
<path class="edge" d="M580 405 V475"/>
<text x="606" y="443" class="label">会话启动 / 工具 / 事件</text>
<path class="dash" d="M306 335 H372"/>
<text x="340" y="318" text-anchor="middle" class="label">装配</text>
<path class="edge" d="M790 535 H858"/>
<text x="824" y="518" text-anchor="middle" class="label">模型调用</text>
<path class="edge" d="M580 595 V690"/>
<text x="606" y="645" class="label">分析脚本</text>
<path class="edge" d="M372 370 H338 V740 H372"/>
<rect x="313" y="640" width="50" height="54" rx="7" fill="#f8fafc"/>
<text x="338" y="672" text-anchor="middle" class="label">领域服务</text>

<rect x="372" y="110" width="418" height="110" rx="13" fill="#edf3fa" stroke="#496a93" stroke-opacity=".4"/>
<rect x="372" y="128" width="4" height="74" rx="2" fill="#496a93"/>
<text x="396" y="139" class="kicker" fill="#496a93">01 / 交互入口</text>
<text x="396" y="171" class="name">桌面 · Web · CLI</text>
<text x="396" y="198" class="body">Electron + React / 浏览器入口 / TransportX CLI</text>

<rect x="372" y="280" width="418" height="125" rx="13" fill="#e9f5f2" stroke="#168278" stroke-opacity=".4"/>
<rect x="372" y="298" width="4" height="89" rx="2" fill="#168278"/>
<text x="396" y="309" class="kicker" fill="#168278">02 / 会话与资源边界</text>
<text x="396" y="341" class="name">Node Agent Host</text>
<text x="396" y="368" class="body">会话 · 模型配置 · 模块装配 · 领域服务</text>
<text x="396" y="390" class="body">保存任务计划，控制资源访问和执行进程。</text>

<rect x="372" y="475" width="418" height="120" rx="13" fill="#eef0fb" stroke="#5263b5" stroke-opacity=".4"/>
<rect x="372" y="493" width="4" height="84" rx="2" fill="#5263b5"/>
<text x="396" y="504" class="kicker" fill="#5263b5">03 / AGENT 执行循环</text>
<text x="396" y="536" class="name">Pi Agent</text>
<text x="396" y="563" class="body">模型循环 · 基础工具 · Extensions · Skills</text>
<text x="396" y="585" class="body">按当前任务加载已选择的模块能力。</text>

<g aria-label="模块能力体系">
  <rect x="30" y="110" width="276" height="680" rx="13" fill="#faf3e7" stroke="#a57835" stroke-opacity=".4"/>
  <text x="50" y="139" class="kicker" fill="#a57835">MODULE / 能力体系</text>
  <text x="50" y="171" class="name">可组合模块</text>
  <text x="50" y="195" class="module-body">按任务选择，按精确版本冻结</text>

  <rect x="48" y="222" width="240" height="58" rx="8" fill="#fffdf8" stroke="#e8dcc7"/>
  <text x="62" y="246" class="module-title">GIS 与空间分析</text>
  <text x="62" y="267" class="module-body">地图发布、双向交互与空间计算</text>
  <rect x="48" y="291" width="240" height="58" rx="8" fill="#fffdf8" stroke="#e8dcc7"/>
  <text x="62" y="315" class="module-title">视频检索与处理</text>
  <text x="62" y="336" class="module-body">检索、播放、截图、裁剪与抽帧</text>
  <rect x="48" y="360" width="240" height="58" rx="8" fill="#fffdf8" stroke="#e8dcc7"/>
  <text x="62" y="384" class="module-title">引用与证据追溯</text>
  <text x="62" y="405" class="module-body">证据注册、引用标注与原文定位</text>
  <rect x="48" y="429" width="240" height="58" rx="8" fill="#fffdf8" stroke="#e8dcc7"/>
  <text x="62" y="453" class="module-title">数据与知识</text>
  <text x="62" y="474" class="module-body">指标分析、数据查询与知识检索</text>
  <rect x="48" y="498" width="240" height="58" rx="8" fill="#fffdf8" stroke="#e8dcc7"/>
  <text x="62" y="522" class="module-title">任务规划与交互</text>
  <text x="62" y="543" class="module-body">步骤拆解、进度管理与用户提问</text>
  <rect x="48" y="567" width="240" height="58" rx="8" fill="#fffdf8" stroke="#e8dcc7"/>
  <text x="62" y="591" class="module-title">报告与图表</text>
  <text x="62" y="612" class="module-body">模板、图件、制图指引与引用汇集</text>

  <path d="M50 650 H286" stroke="#e8dcc7"/>
  <text x="50" y="680" class="module-title">内置能力 + 可安装模块</text>
  <text x="50" y="714" class="body">Skill · Extension · Data</text>
  <text x="50" y="738" class="body">Knowledge · Template · Runtime</text>
</g>

<rect x="858" y="475" width="272" height="120" rx="13" fill="#eef0fb" stroke="#5263b5" stroke-opacity=".4"/>
<rect x="858" y="493" width="4" height="84" rx="2" fill="#5263b5"/>
<text x="882" y="504" class="kicker" fill="#5263b5">模型服务</text>
<text x="882" y="536" class="name">Model Provider</text>
<text x="882" y="563" class="body">本地或远程模型</text>
<text x="882" y="585" class="body">返回回复或工具调用。</text>

<rect x="372" y="690" width="418" height="100" rx="13" fill="#f0f3f7" stroke="#627388" stroke-opacity=".4"/>
<rect x="372" y="708" width="4" height="64" rx="2" fill="#627388"/>
<text x="396" y="719" class="kicker" fill="#627388">分析执行环境</text>
<text x="396" y="751" class="name">Python</text>
<text x="396" y="778" class="body">数据查询 · 空间计算 · 统计制图</text>

<text x="36" y="822" class="small">实线：运行时调用与交互</text>
<text x="36" y="840" class="small">虚线：模块装配</text>
<text x="1124" y="822" text-anchor="end" class="small">Module 精确版本随任务冻结</text>
</svg>
