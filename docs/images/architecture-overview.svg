<text x="62" y="307" class="small">视频查询 · 播放 · 截图与裁剪</text>
<rect x="48" y="332" width="234" height="58" rx="7" fill="#fffdf8" stroke="#e8dcc7"/>
<text x="62" y="355" font-size="15" font-weight="600" fill="#765521">引用 · 证据追溯</text>
<text x="62" y="376" class="small">注册证据 · 引用标注 · 原文定位</text>
<rect x="48" y="401" width="234" height="58" rx="7" fill="#fffdf8" stroke="#e8dcc7"/>
<text x="62" y="424" font-size="15" font-weight="600" fill="#765521">数据与知识 · 交通问数</text>
<text x="62" y="445" class="small">数据查询 · 指标分析 · 知识检索</text>
<rect x="48" y="470" width="234" height="58" rx="7" fill="#fffdf8" stroke="#e8dcc7"/>
<text x="62" y="493" font-size="15" font-weight="600" fill="#765521">任务 · 规划与交互</text>
<text x="62" y="514" class="small">步骤拆解 · 进度管理 · 用户提问</text>
<rect x="48" y="539" width="234" height="58" rx="7" fill="#fffdf8" stroke="#e8dcc7"/>
<text x="62" y="562" font-size="15" font-weight="600" fill="#765521">报告与图表 · 成果输出</text>
<text x="62" y="583" class="small">模板与绘图指引 · 汇集图件和引用</text>
<path d="M50 620 H280" stroke="#e8dcc7"/>
<text x="50" y="645" font-size="14" font-weight="600" fill="#765521">内置能力 + 可安装模块</text>
<text x="50" y="673" class="small">通过以下内容组合实现</text>
<text x="50" y="699" class="body">Skill · Extension</text>
<text x="50" y="723" class="body">Data · Knowledge · Template</text>
<text x="50" y="757" class="small">由 Host 装配，供 Agent 调用</text>
</g>
<rect x="860" y="470" width="270" height="120" rx="12" fill="#eef0fb" stroke="#5263b5" stroke-opacity=".38"/>
<rect x="860" y="488" width="4" height="84" rx="2" fill="#5263b5"/>
<text x="884" y="498" class="kicker" fill="#5263b5">模型服务</text>
<text x="884" y="529" class="name">Model Provider</text>
<text x="884" y="555" class="body">本地或远程模型</text>
<text x="884" y="578" class="body">接收上下文，返回回复或工具调用</text>
<rect x="370" y="680" width="420" height="100" rx="12" fill="#f0f3f7" stroke="#627388" stroke-opacity=".38"/>
<rect x="370" y="698" width="4" height="64" rx="2" fill="#627388"/>
<text x="394" y="708" class="kicker" fill="#627388">分析执行环境</text>
<text x="394" y="739" class="name">Python</text>
<text x="394" y="765" class="body">数据查询 · 空间计算 · 统计制图</text>
<text x="36" y="817" class="small">实线：运行时调用与交互　 ·　 虚线：模块装配</text>
<text x="1124" y="817" text-anchor="end" class="small">模块内容按任务选择，精确版本随会话冻结</text></svg>