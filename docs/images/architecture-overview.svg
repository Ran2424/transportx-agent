<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="850" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc">
<title id="title">TransportX 整体架构</title>
<desc id="desc">交互入口通过 Agent Host 连接 Pi Agent。Module 提供 GIS、视频、引用、数据知识、任务及报告能力，并装配到 Host；Pi 调用模型。Host 领域服务和 Pi 分析脚本分别调用计算运行时。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#728397" stroke-width="1.6"/></marker></defs>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.heading{font-size:28px;font-weight:650;fill:#182f45}.subtitle{font-size:14px;fill:#617489}
.kicker{font-size:12px;font-weight:650;letter-spacing:1.2px}.name{font-size:23px;font-weight:650;fill:#183148}
.body{font-size:15px;fill:#52677c}.small{font-size:13px;fill:#52677c}.label{font-size:13px;fill:#617489}
.edge{fill:none;stroke:#728397;stroke-width:1.7;marker-end:url(#arrow)}
</style>
<rect width="1160" height="850" rx="20" fill="#f8fafc"/>
<text x="36" y="48" class="heading">TransportX · 整体架构</text>
<text x="36" y="75" class="subtitle">交互入口 → 会话与资源管理 → Agent 执行</text>
<!-- Relationships are drawn behind cards. -->
<path class="edge" d="M580 222 V280"/>
<text x="599" y="256" class="label">用户请求 / 状态反馈</text>
<path class="edge" d="M580 400 V470"/>
<text x="599" y="440" class="label">会话启动 / 工具与事件</text>
<path class="edge" stroke-dasharray="5 5" d="M300 310 H370"/>
<path class="edge" d="M790 530 H860"/>
<path class="edge" d="M580 590 V680"/>
<text x="599" y="640" class="label">分析脚本</text>
<path class="edge" d="M370 365 H336 V730 H370"/>
<rect x="318" y="607" width="36" height="65" rx="6" fill="#f8fafc"/>
<text x="336" y="627" text-anchor="middle" class="label">领域</text>
<text x="336" y="648" text-anchor="middle" class="label">服务</text>

<rect x="370" y="110" width="420" height="112" rx="12" fill="#edf3fa" stroke="#496a93" stroke-opacity=".38"/>
<rect x="370" y="128" width="4" height="76" rx="2" fill="#496a93"/>
<text x="394" y="138" class="kicker" fill="#496a93">01 / 交互入口</text>
<text x="394" y="169" class="name">桌面 · Web · CLI</text>
<text x="394" y="195" class="body">Electron + React / React / TransportX CLI</text>
<rect x="370" y="280" width="420" height="120" rx="12" fill="#e9f5f2" stroke="#168278" stroke-opacity=".38"/>
<rect x="370" y="298" width="4" height="84" rx="2" fill="#168278"/>
<text x="394" y="308" class="kicker" fill="#168278">02 / 会话与资源管理</text>
<text x="394" y="339" class="name">Node Agent Host</text>
<text x="394" y="365" class="body">会话 · 模型配置 · 模块装配 · 领域服务</text>
<text x="394" y="388" class="body">保存会话计划，管理资源访问与执行进程</text>
<rect x="370" y="470" width="420" height="120" rx="12" fill="#eef0fb" stroke="#5263b5" stroke-opacity=".38"/>
<rect x="370" y="488" width="4" height="84" rx="2" fill="#5263b5"/>
<text x="394" y="498" class="kicker" fill="#5263b5">03 / AGENT 执行</text>
<text x="394" y="529" class="name">Pi Agent</text>
<text x="394" y="555" class="body">模型调用循环 · 基础工具 · Extensions</text>
<text x="394" y="578" class="body">按当前会话加载 Skills 与模块能力</text>
<g aria-label="Module 产品能力：GIS、视频、引用、数据知识、任务与报告">
<rect x="30" y="110" width="270" height="670" rx="12" fill="#faf3e7" stroke="#a57835" stroke-opacity=".38"/>
<text x="50" y="138" class="kicker" fill="#a57835">产品能力 / 按需组合</text>
<text x="50" y="169" class="name">Module 能力体系</text>
