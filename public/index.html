<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Traffic Workspace</title>
  <link rel="icon" type="image/png" href="icons/tau-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="交通工作台">
  <meta name="theme-color" content="#f7faff">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Left Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="mode-toggle" id="mode-toggle">
          <span class="mode-link active" title="对话"><img src="icons/tau-192.png" alt="τ" class="tau-icon"></span>
        </div>
        <input type="text" id="session-search-input" class="sidebar-search-input" placeholder="搜索会话..." autocomplete="off" />
        <div class="sidebar-actions">
          <button class="icon-btn" id="new-session-btn" title="新建交通任务" aria-label="新建交通任务"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
          <button class="icon-btn" id="refresh-sessions-btn" title="刷新会话" aria-label="刷新会话"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
        </div>
      </div>
      <div class="session-list" id="session-list">
        <div class="session-loading">正在加载会话...</div>
      </div>
    </div>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Chat Area -->
    <div class="main">
      <!-- Header -->
      <div class="header">
        <div class="header-left">
          <button class="sidebar-toggle" id="sidebar-toggle" title="展开/收起侧栏" aria-label="展开/收起侧栏"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <button class="model-select-trigger" id="model-input" type="button"
                  title="选择本任务使用的模型与思考级别"
                  aria-label="选择模型与思考级别">
            <span class="model-input-label" id="model-input-label">模型</span>
            <span class="model-select-chevron" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
          </button>
        </div>
        <div class="header-right">
          <div class="stats-anchor">
            <button class="pill context-pill" id="context-pill" type="button" title="上下文用量，点击查看会话统计" aria-haspopup="true" aria-expanded="false"></button>
            <div class="stats-card hidden" id="session-stats-card"></div>
          </div>
          <div class="status">
            <span class="status-indicator" id="status-indicator"></span>
            <span class="status-text" id="status-text">正在连接...</span>
          </div>
          <button class="icon-btn" id="file-sidebar-toggle" title="文件" aria-label="打开/关闭文件浏览器">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          </button>
          <button class="settings-btn" id="settings-btn" title="设置" aria-label="设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- In-page live-session tabs -->
      <div class="live-tabs" id="live-tabs">
        <div class="live-tabs-list" id="live-tabs-list"></div>
        <button class="live-tab-add" id="live-tab-add" title="新建交通任务" aria-label="新建交通任务">+</button>
      </div>

      <!-- Launcher (project picker) -->
      <div class="launcher hidden" id="launcher"></div>

      <!-- Messages Container -->
      <div class="messages" id="messages">
        <div class="welcome">
          <div class="welcome-icon"><img src="icons/tau-192.png" alt="τ" class="tau-icon-welcome"></div>
          <p>欢迎使用交通工作台</p>
          <p class="hint">新建一个交通任务，或从侧栏查看历史会话。</p>
          <div class="shortcuts-hint">
            <span>/ 聚焦输入框</span>
            <span>Esc 中止</span>
          </div>
        </div>
      </div>

      <!-- Scroll to bottom + new message indicator -->
      <button class="scroll-bottom-btn hidden" id="scroll-bottom-btn">
        <span class="scroll-bottom-badge hidden" id="scroll-bottom-badge">新消息 <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></span>
        <span class="scroll-bottom-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></span>
      </button>

      <!-- Typing indicator (hidden, kept for JS reference) -->
      <div class="typing-indicator hidden" id="typing-indicator"></div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="queued-messages hidden" id="queued-messages"></div>
        <div class="image-previews hidden" id="image-previews"></div>
        <form id="chat-form">
          <div class="input-left-actions">
            <button type="button" class="input-icon-btn" id="command-btn" title="命令" aria-label="打开命令面板" tabindex="-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg>
            </button>
            <button type="button" class="input-icon-btn" id="attach-btn" title="附加图片。图片会以二进制数据上传；引用本地文件请使用右侧文件浏览器。" aria-label="附加图片" tabindex="-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            </button>

            <input type="file" id="image-input" accept="image/*" multiple style="display:none" />
          </div>
          <div class="input-bubble">
            <textarea
              id="message-input"
              placeholder="输入交通问题或 Pi 指令...（Enter 发送，Shift+Enter 换行）"
              autocomplete="off"
              rows="2"

            ></textarea>
            <button type="button" class="input-mic-btn" id="mic-btn" title="语音输入" tabindex="-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            </button>
          </div>
          <div class="input-actions">
            <button type="submit" id="send-btn" title="发送" tabindex="-1">
              <span class="send-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></span>
            </button>
            <button type="button" id="abort-btn" class="hidden" title="中止（Esc）" tabindex="-1"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
          </div>
        </form>
      </div>
    </div>

    <!-- Workspace Browser (right sidebar) -->
    <div class="file-sidebar collapsed" id="file-sidebar">
      <div class="file-sidebar-header">
        <span class="file-sidebar-title" id="file-sidebar-title">工作区</span>
        <button class="icon-btn file-sidebar-file-action" id="file-sidebar-up" title="上一级目录">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        </button>
        <button class="icon-btn file-sidebar-file-action" id="file-sidebar-finder" title="在文件管理器中打开">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
        </button>
        <button class="icon-btn" id="file-sidebar-close" title="关闭" aria-label="关闭文件浏览器"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="file-sidebar-tabs" id="file-sidebar-tabs">
        <button class="file-sidebar-tab active" type="button" data-resource-view="files">文件</button>
        <button class="file-sidebar-tab" type="button" data-resource-view="skills">技能</button>
        <button class="file-sidebar-tab" type="button" data-resource-view="tools">工具</button>
        <button class="file-sidebar-tab" type="button" data-resource-view="visualizations">地图</button>
      </div>
      <div class="file-sidebar-path" id="file-sidebar-path" title=""></div>
      <div class="file-list" id="file-list"></div>
      <div class="resource-list hidden" id="resource-list"></div>
      <div class="geo-panel hidden" id="geo-panel">
        <div class="geo-panel-heading">
          <div>
            <div class="geo-panel-title" id="geo-panel-title">GIS 可视化</div>
            <div class="geo-panel-status" id="geo-panel-status">当前任务还没有地图</div>
          </div>
          <select class="geo-visualization-select" id="geo-visualization-select" aria-label="选择地图"></select>
        </div>
        <div class="geo-map-shell">
          <div class="geo-empty" id="geo-empty">
            <span class="geo-empty-mark">◇</span>
            <strong>等待空间结果</strong>
            <span>Agent 生成地图后会在这里持续展示。</span>
          </div>
          <div class="geo-map hidden" id="geo-map"></div>
        </div>
        <div class="geo-layer-list" id="geo-layer-list"></div>
        <div class="geo-metadata" id="geo-metadata"></div>
      </div>
    </div>
  </div>

  <!-- Settings Overlay -->
  <div class="settings-overlay hidden" id="settings-overlay"></div>

  <!-- Settings Panel -->
  <div class="settings-panel hidden" id="settings-panel">
    <div class="settings-header">
      <h3>设置</h3>
      <button class="settings-close" id="settings-close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-section-title">外观</div>
        <div class="theme-grid" id="theme-grid"></div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">Agent</div>
        <div class="settings-row" id="setting-auto-compact">
          <span class="settings-label">自动压缩上下文</span>
          <button class="settings-toggle" id="toggle-auto-compact"></button>
        </div>
        <div class="settings-row" id="setting-thinking">
          <span class="settings-label">思考级别</span>
          <button class="settings-value-btn" id="btn-thinking-level"></button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-section-title">显示</div>
        <div class="settings-row">
          <span class="settings-label">显示思考过程</span>
          <button class="settings-toggle on" id="toggle-show-thinking"></button>
        </div>
      </div>
      <div class="settings-section" id="settings-auth-section" style="display:none">
        <div class="settings-section-title">登录验证</div>
        <div class="settings-row">
          <span class="settings-label">要求登录</span>
          <button class="settings-toggle" id="toggle-auth"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Command Palette -->
  <div class="command-palette-overlay hidden" id="command-palette-overlay"></div>
  <div class="command-palette hidden" id="command-palette">
    <div class="command-palette-header">命令</div>
    <div class="command-list" id="command-list"></div>
  </div>

  <!-- Model Picker -->
  <div class="model-picker-overlay hidden" id="model-picker-overlay"></div>
  <div class="model-picker hidden" id="model-picker" role="dialog" aria-modal="true" aria-labelledby="model-picker-title">
    <div class="model-picker-header">
      <h3 id="model-picker-title">模型</h3>
      <button class="model-picker-close" id="model-picker-close" type="button" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="model-picker-body">
      <div class="model-picker-controls">
        <label class="model-picker-field" for="model-picker-select">
          <span>模型</span>
          <select class="model-picker-select" id="model-picker-select"></select>
        </label>
        <label class="model-picker-field" for="model-thinking-select">
          <span>思考级别</span>
          <select class="model-picker-select" id="model-thinking-select">
            <option value="off">关闭</option>
            <option value="minimal">极简</option>
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
            <option value="xhigh">极高</option>
          </select>
        </label>
      </div>
      <div class="model-picker-message" id="model-picker-message">从 Pi 已有模型列表中选择；思考级别单独设置。</div>
    </div>
    <div class="model-picker-actions">
      <button type="button" class="secondary-btn" id="model-picker-cancel">取消</button>
      <button type="button" class="primary-btn" id="model-picker-save">保存</button>
    </div>
  </div>

  <!-- New live session modal -->
  <div class="new-live-session-overlay hidden" id="new-live-session-overlay"></div>
  <div class="new-live-session-modal hidden" id="new-live-session-modal">
    <div class="new-live-session-header">
      <h3>新建交通任务</h3>
      <button class="settings-close" id="new-live-session-close" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <form class="new-live-session-body" id="new-live-session-form">
      <label class="new-live-session-label" for="new-live-session-name">会话名称</label>
      <input class="new-live-session-input" id="new-live-session-name" type="text" placeholder="例如：早高峰拥堵分析" autocomplete="off" required>
      <input id="new-live-session-cwd" type="hidden">
      <p class="new-live-session-help" id="new-live-session-cwd-preview">将在 scenario 下创建：时间-会话名称 的新目录</p>
      <label class="new-live-session-label" for="new-live-session-model">模型</label>
      <select class="new-live-session-input" id="new-live-session-model">
        <option value="">使用 Pi 默认模型</option>
      </select>
      <p class="new-live-session-help">从 Pi 已有模型列表中选择；仅作用于当前任务。</p>
      <div class="new-live-session-actions">
        <button type="button" class="secondary-btn" id="new-live-session-cancel">取消</button>
        <button type="submit" class="primary-btn" id="new-live-session-submit">创建任务</button>
      </div>
    </form>
  </div>

  <!-- Dialog Container -->
  <div id="dialog-container" class="hidden"></div>

  <!-- Scripts -->
  <script type="module" src="app.js"></script>
</body>
</html>
