name: Desktop startup regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: startup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm test
          - os: windows-latest
            command: npm run build && node --test --test-reporter=./scripts/test-budget-reporter.mjs test/suites/desktop-launch.test.ts test/suites/desktop-runtime.test.ts test/suites/model.test.ts test/suites/module-installer.test.ts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TAU_PYTHON_COMMAND: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r desktop/python-requirements.txt
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run test:budget
      - run: npm run typecheck
      - run: ${{ matrix.command }}
      - run: node scripts/desktop-smoke.mjs
