name: Linux RPM installation validation
on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: transportx-linux-x64-rpm-test
          path: release
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the exact RPM checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS-linux-x64-rpm.txt
      - name: Install, check bundled runtimes and uninstall RPM on Rocky Linux 8
        shell: bash
        run: |
          docker pull rockylinux:8
          docker image inspect rockylinux:8 > release/linux-x64-rpm-install-validation.txt
          docker run --rm -v "$PWD/release:/packages:ro" rockylinux:8 bash -eu -o pipefail -c '
            cat /etc/os-release
            getconf GNU_LIBC_VERSION
            test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
            dnf install -y /packages/*-linux-x64.rpm
            rpm -q transportx-agent
            test -x "/opt/TransportX Agent/transportx-agent"
            test -e /usr/bin/transportx-agent
            test -f /usr/share/applications/transportx-agent.desktop
            ldd "/opt/TransportX Agent/transportx-agent" > /tmp/transportx-ldd.txt
            cat /tmp/transportx-ldd.txt
            if grep -q "not found" /tmp/transportx-ldd.txt; then exit 1; fi
            ELECTRON_RUN_AS_NODE=1 "/opt/TransportX Agent/transportx-agent" -e "console.log(JSON.stringify({arch:process.arch,node:process.version}))"
            "/opt/TransportX Agent/resources/runtimes/python/bin/python3" -B -I -c "import ezdxf,matplotlib,numpy,pandas,platform,pyproj,shapely,sqlite3,ssl,yaml; print(platform.python_version())"
            stat -c "sandbox: %U:%G %a %n" "/opt/TransportX Agent/chrome-sandbox"
            rpm -e transportx-agent
            test ! -e "/opt/TransportX Agent/transportx-agent"
            test ! -e /usr/bin/transportx-agent
            test ! -e /usr/share/applications/transportx-agent.desktop
            echo RPM_INSTALL_RUNTIME_UNINSTALL_PASS
          ' | tee -a release/linux-x64-rpm-install-validation.txt
          grep -qx RPM_INSTALL_RUNTIME_UNINSTALL_PASS release/linux-x64-rpm-install-validation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transportx-linux-x64-rpm-validation
          retention-days: 14
          path: release/linux-x64-rpm-install-validation.txt
