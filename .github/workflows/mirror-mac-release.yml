name: Mirror verified Mac release from OSS
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror-mac-3.24.0
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: 3.24.0
      RELEASE_ID: '426625295'
      RELEASE_SOURCE: 28cfc891ff6aec6a2d200f74a99870a69e28e03f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm draft target and derive official download URLs
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          jq -e --arg source "$RELEASE_SOURCE" '.draft == true and .target_commitish == $source' release.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getPlatformProfile } from './desktop/scripts/platform-profile.mjs';
          const profile = getPlatformProfile('mac');
          const base = new URL(profile.update.url).origin + '/releases/v' + process.env.RELEASE_VERSION + '/';
          fs.writeFileSync('download-base.txt', base);
          fs.writeFileSync('expected-names.txt', profile.update.requiredExtensions.map(extension => profile.update.artifactName.replace('${version}', process.env.RELEASE_VERSION).replace('${ext}', extension.slice(1))).join('\n') + '\n');
          NODE
          curl --fail --location --retry 3 --header 'Accept-Encoding: identity' "$(cat download-base.txt)build-info-mac-$RELEASE_VERSION.json" -o build-info.json
          jq -e --arg version "$RELEASE_VERSION" --arg source "$RELEASE_SOURCE" '.version == $version and .sourceRevision == $source and .distribution == "stable"' build-info.json
      - name: Verify and mirror installer archives
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            sha=$(jq -r --arg name "$name" '.files[] | select(.name == $name) | .sha256' build-info.json)
            [[ "$sha" =~ ^[a-f0-9]{64}$ ]]
            curl --fail --location --retry 3 --header 'Accept-Encoding: identity' "$(cat download-base.txt)$name" -o "$name"
            printf '%s  %s\n' "$sha" "$name" | sha256sum --check --strict
            gh release upload "v$RELEASE_VERSION" "$name" --repo "$GITHUB_REPOSITORY"
          done < expected-names.txt
