    <script>
        /*将请求来的base64编码的pdf文件，替换多余的空格和换行（为了兼容其他浏览器）
        * 再使用浏览器自带的atob()的方式解析
        * */
        /*转化编码格式*/
        function converData(data) {
            data = data.replace(/[\n\r]/g, '');
            var raw = window.atob(data);
            var rawLength = raw.length;
            var array = new Uint8Array(new ArrayBuffer(rawLength));
            for (var i = 0; i < rawLength; i++) {
                array[i] = raw.charCodeAt(i)
            }
            return array
        }

        /*将解码后的值传给PDFJS.getDocument(),交给pdf.js处理*/
        var loadtask = null;
        function showPdfFile(data) {
            var fileContent = converData(data);
            $('#containerPdf').show();
            $('#pop').empty();
            loadtask = pdfjsLib.getDocument(fileContent);

            loadtask.then(function getPdfHelloWorld(pdf) {
                pages = pdf.numPages;
                for (var i = 1; i <= pdf.numPages; i++) {
                    var id = 'page-id' + i;
                    $('#pop').append('<canvas id="' + id + '"></canvas>');
                    showAll('', i, id);
                }
            })
        }

        function showAll(url, i, id) {
            loadtask.promise.then(function getPdfHelloWorld(pdf) {
                pdf.getPage(i).then(function getPageHelloWorld(page) {
                    var scale = 1.0,
                        viewport = page.getViewport(scale),
                        scale2 = $('#pop').width() / viewport.width,
                        viewport2 = page.getViewport(scale2),
                        canvas = document.getElementById(id),
                        context = canvas.getContext('2d');
                    canvas.height = viewport2.height;
                    canvas.width = $('#pop').width();
                    var renderContext = {
                        canvasContext: context,
                        viewport: viewport2
                    }
                    page.render(renderContext);

                })

            })
        }

    </script>
